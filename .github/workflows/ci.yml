name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      # Fails if a checked-in generated artifact drifted from its source.
      # See scripts/verify-generated.mjs for why this gate exists.
      - run: npm run verify:generated
      - run: npm run build
      - run: npm test
      - run: npm run verify:generated
      # Smoke-tests the actual CLI (arg parsing, unresolved triage, --check
      # disk comparison) against the real-world fixture, using the same
      # frozen output already reviewed as testdata/golden/real-world/ (see
      # codegen/tokens/src/golden.config.ts). vitest already covers this at
      # the emitter level; this step covers the CLI entry point itself.
      - name: codegen-tokens --check (real-world fixture)
        run: |
          npm run cli --workspace=@figma-normalizator/codegen-tokens -- \
            --input ../../fixtures/src/real-world/gPHx1sqQHIfMs8706VDGM1_c1-88d0431a4019ec4b.tokens.json \
            --output ../../codegen/tokens/testdata/golden/real-world \
            --package com.dexcom.tokens \
            --exclude-mode "[iI][oO][sS]" \
            --on-unresolved unsupported-value=warn \
            --check
