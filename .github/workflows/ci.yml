name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      # Fails if a checked-in generated artifact drifted from its source.
      # See scripts/verify-generated.mjs for why this gate exists.
      - run: npm run verify:generated
      - run: npm run build
      - run: npm test
