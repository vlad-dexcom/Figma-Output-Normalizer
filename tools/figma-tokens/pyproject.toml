[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "figma-tokens"
version = "2.0.0"
description = "Generate Swift/Kotlin design token code from Figma variables"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "tomli>=2.0"]

[project.scripts]
figma-tokens = "figma_tokens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
