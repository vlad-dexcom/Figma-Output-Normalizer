<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Figma Normalizator</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #888888;
        --border: #e0e0e0;
        --panel-bg: #fafafa;
        --panel-border: #eeeeee;
        --button-bg: #ffffff;
        --button-fg: #1a1a1a;
        --button-border: #d0d0d0;
        --primary-bg: #18a0fb;
        --primary-fg: #ffffff;
        --primary-border: #18a0fb;
        --banner-bg: #fff2e6;
        --banner-border: #ffb066;
        --banner-fg: #9a4d00;
        --success: #1a7a3a;
        --error: #b3261e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #2c2c2c;
          --fg: #ffffff;
          --muted: #b3b3b3;
          --border: #444444;
          --panel-bg: #232323;
          --panel-border: #3d3d3d;
          --button-bg: #3d3d3d;
          --button-fg: #ffffff;
          --button-border: #555555;
          --primary-bg: #18a0fb;
          --primary-fg: #ffffff;
          --primary-border: #18a0fb;
          --banner-bg: #4a3315;
          --banner-border: #cc8a33;
          --banner-fg: #ffc178;
          --success: #4cd97b;
          --error: #ff6b60;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        font:
          12px -apple-system,
          "Segoe UI",
          sans-serif;
        margin: 0;
        padding: 0;
        color: var(--fg);
        background: var(--bg);
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        flex: none;
      }
      header .label {
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      header .name {
        font-size: 13px;
        font-weight: 600;
        margin-top: 2px;
        word-break: break-word;
        color: var(--fg);
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        flex: none;
      }
      button {
        font: inherit;
        border: 1px solid var(--button-border);
        background: var(--button-bg);
        color: var(--button-fg);
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button.primary {
        background: var(--primary-bg);
        border-color: var(--primary-border);
        color: var(--primary-fg);
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .copy-status {
        font-size: 11px;
        color: var(--success);
      }
      .copy-status.error {
        color: var(--error);
      }
      main {
        flex: 1;
        overflow: auto;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      section h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 0 0 6px;
      }
      .section-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .section-header h2 {
        margin: 0 0 6px;
      }
      .link-button {
        font: inherit;
        border: none;
        background: none;
        color: #18a0fb;
        padding: 0;
        cursor: pointer;
        text-decoration: underline;
      }
      .link-button:hover {
        text-decoration: none;
      }
      #banner {
        display: none;
        background: var(--banner-bg);
        border: 1px solid var(--banner-border);
        color: var(--banner-fg);
        border-radius: 6px;
        padding: 8px 10px;
        font-weight: 600;
      }
      #banner.visible {
        display: block;
      }
      #ir-preview {
        width: 100%;
        min-height: 160px;
        resize: vertical;
        font:
          11px ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px;
        background: var(--panel-bg);
        color: var(--fg);
        white-space: pre;
        overflow: auto;
      }
      .warning-group {
        margin-bottom: 10px;
      }
      .warning-group-title {
        font-weight: 600;
        margin-bottom: 4px;
        color: var(--fg);
      }
      .warning-entry {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 8px;
        border: 1px solid var(--panel-border);
        border-radius: 6px;
        margin-bottom: 4px;
        color: var(--fg);
      }
      .warning-entry .text {
        min-width: 0;
      }
      .warning-entry .detail {
        color: var(--muted);
        margin-top: 2px;
      }
      .warning-entry .node-id {
        color: var(--muted);
        font:
          10px ui-monospace,
          monospace;
        margin-top: 2px;
      }
      .warning-entry button {
        flex: none;
      }
      #empty-warnings,
      #empty-ir {
        color: var(--muted);
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="label">Selected layer</div>
      <div class="name" id="selection-name">Nothing selected</div>
    </header>
    <div class="toolbar">
      <button class="primary" id="extract-button">Extract</button>
      <button id="export-button" disabled>Export</button>
      <button id="copy-button" disabled>Copy to clipboard</button>
      <span id="copy-status" class="copy-status"></span>
    </div>
    <!--
      Tokens are a FILE-scoped export and screens are SELECTION-scoped, so
      these live on their own row rather than beside Extract: they are not
      affected by the current selection, and grouping them would imply they
      were.
    -->
    <div class="toolbar">
      <button id="extract-tokens-button">Extract tokens</button>
      <button id="export-tokens-button" disabled>Export tokens</button>
      <span id="tokens-status" class="copy-status"></span>
    </div>
    <main>
      <div id="banner"></div>
      <section>
        <div class="section-header">
          <h2>Warnings</h2>
          <button id="warnings-toggle" class="link-button" type="button" hidden>
            Collapse all
          </button>
        </div>
        <div id="warnings"><p id="empty-warnings">No warnings yet — click Extract.</p></div>
      </section>
      <section>
        <h2>IR preview</h2>
        <pre id="ir-preview">Click Extract to see the IR for the current selection.</pre>
      </section>
    </main>
    <!-- BUILD:UI_SCRIPT -->
    <!--
      Built via `npm run build` in this package: `scripts/build.mjs`
      bundles `src/ui.ts` with esbuild and replaces the comment above with
      an inline <script> tag containing the bundled JS. Figma's plugin UI
      is a sandboxed iframe with no external resource loading (and this
      manifest declares no network access), so the UI's JS must be inlined
      directly into this HTML file rather than referenced from a separate
      file.
    -->
  </body>
</html>
